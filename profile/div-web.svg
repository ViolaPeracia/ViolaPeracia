<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" preserveAspectRatio="none" role="img" aria-label="section divider">
  <defs>
    <pattern id="dash" width="12" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="3" fill="#00d9ff" fill-opacity="0.35"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g>
    <rect x="0" y="26.0" width="216" height="4" fill="#00d9ff" fill-opacity="0.9"/>
    <rect x="216" y="26.0" width="120" height="4" fill="#e6edf3" fill-opacity="0.85"/>
    <rect x="336" y="26.0" width="72" height="4" fill="#00ff99" fill-opacity="0.9"/>
    <rect x="408" y="26.0" width="192" height="4" fill="#ff2e88" fill-opacity="0.9"/>
    <rect x="600" y="26.0" width="96" height="4" fill="#00d9ff" fill-opacity="0.9"/>
    <rect x="696" y="26.0" width="264" height="4" fill="#e6edf3" fill-opacity="0.85"/>
  </g>
  <rect x="0" y="36.0" width="1200" height="3" fill="url(#dash)"/>
  <rect x="0" y="0" width="1200" height="56" filter="url(#grain)" opacity="0.07"/>
</svg>
