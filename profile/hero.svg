<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Hung_Vux, systems builder">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#00ff99" stroke-width="4"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#00d9ff"/>
    </pattern>
    <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="5" fill="#ff2e88"/>
    </pattern>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="halftone-fade">
      <rect x="0" y="0" width="1200" height="300" fill="url(#fade-r)"/>
    </mask>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="#0d1117"/>

  <g style="isolation:isolate">
    <rect x="0" y="0" width="1200" height="300" fill="url(#hatch)" fill-opacity="0.09"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#dots)" fill-opacity="0.14"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#halftone)" fill-opacity="0.45" mask="url(#halftone-fade)"/>
    <g style="mix-blend-mode:screen">
      <circle cx="140" cy="160" r="155" fill="#ff2e88" fill-opacity="0.30"/>
      <circle cx="1065" cy="140" r="130" fill="#00d9ff" fill-opacity="0.30"/>
      <path d="M600 34 L706 172 L494 172 Z" fill="#ffd400" fill-opacity="0.18"/>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="300" filter="url(#grain)" opacity="0.13" style="mix-blend-mode:overlay"/>

  <rect x="0" y="0" width="1200" height="7" fill="#00ff99"/>
  <g transform="translate(0 290)">
    <rect x="0" width="408" height="10" fill="#ff2e88"/>
    <rect x="408" width="312" height="10" fill="#00d9ff"/>
    <rect x="720" width="264" height="10" fill="#ffd400"/>
    <rect x="984" width="216" height="10" fill="#00ff99"/>
  </g>

  <text x="606" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" text-anchor="middle" fill="#ff2e88" fill-opacity="0.9" letter-spacing="6.0">HUNG_VUX</text>
  <text x="600" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" text-anchor="middle" fill="#00ff99" fill-opacity="1.0" letter-spacing="6.0">HUNG_VUX</text>
  <text x="34" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" text-anchor="start" fill="#00d9ff" fill-opacity="1.0" letter-spacing="1.3">SYSTEMS//BUILDER</text>
  <text x="1166" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" text-anchor="end" fill="#ffd400" fill-opacity="1.0" letter-spacing="1.3">LOCAL-FIRST</text>
  <text x="34" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" text-anchor="start" fill="#e6edf3" fill-opacity="0.62" letter-spacing="1.2">RUST · GO · C · PYTHON</text>
  <text x="1166" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" text-anchor="end" fill="#e6edf3" fill-opacity="0.62" letter-spacing="1.2" transform="rotate(-4 1166 262)">EST.ARCH</text>
</svg>
