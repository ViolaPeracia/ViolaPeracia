  <g transform="translate(0 182)">
    <rect x="0" width="300" height="8" fill="#ff2e88"/>
    <rect x="300" width="240" height="8" fill="#00d9ff"/>
    <rect x="540" width="180" height="8" fill="#ffd400"/>
    <rect x="720" width="480" height="8" fill="#00ff99"/>
  </g>
  <rect x="0" y="0" width="1200" height="190" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:overlay"/>
  <text x="600" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="700" text-anchor="middle" fill="#00ff99" fill-opacity="0.92" letter-spacing="4.0">HUNG_VUX@GITHUB:~$</text>
