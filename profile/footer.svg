<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="end of page">
  <defs>
    <pattern id="dots-f" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#00ff99"/>
    </pattern>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff99" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff99" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
